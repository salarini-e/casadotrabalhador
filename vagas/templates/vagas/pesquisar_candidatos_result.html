{% if candidatos %}
{% for candidato in candidatos %}
<tr>	
    <td style="text-align: center;">
        {{candidato.id}}
    </td>
    <td>
        {{candidato.get_cpf}}
    </td>
    <td style="color: rgb(2, 94, 17);">
        
            {{candidato.nome}}        
    </td>          
    <td style="text-align: center;">
        {{candidato.n_encaminhamentos}}        
    </td>     
    <td style="text-align: center;">
        {{candidato.idade}}        
    </td>        
    <td style="text-align: center;">
        {{candidato.contato}}        
    </td>             
    <td style="text-align: center;"> <a href="{% url 'vagas:visualizar_candidato' candidato.id %}">
            Ver
        </a></td>
    
</tr>
{% endfor %}
{% else %}
<tr class="text-danger">
    <td>
    Nenhum registro encontrado!
    </td>
    <td>-</td>
    <td>-</td>
    <td>
       -
    </td>

<tr>
{% endif %}
