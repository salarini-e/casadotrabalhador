<script>
// Sidebar toggle functionality
document.addEventListener("DOMContentLoaded", function() {
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebar = document.querySelector('.dashboard-sidebar');
    const content = document.querySelector('.dashboard-content');
    const backdrop = document.querySelector('.sidebar-backdrop');
    
    function toggleSidebar() {
        if (window.innerWidth <= 768) {
            // Comportamento mobile
            if (sidebar.classList.contains('collapsed')) {
                // Expandir sidebar
                sidebar.classList.remove('collapsed');
                sidebar.classList.add('show');
                document.body.classList.add('sidebar-open');
            } else {
                // Colapsar sidebar
                sidebar.classList.add('collapsed');
                sidebar.classList.remove('show');
                document.body.classList.remove('sidebar-open');
            }
        } else {
            // Comportamento desktop
            sidebar.classList.toggle('collapsed');
            if (sidebar.classList.contains('collapsed')) {
                content.style.marginLeft = '80px';
            } else {
                content.style.marginLeft = '280px';
            }
        }
    }
    
    // Sidebar toggle click
    if (sidebarToggle) {
        sidebarToggle.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            toggleSidebar();
        });
    }
    
    // Backdrop click to close sidebar on mobile
    if (backdrop) {
        backdrop.addEventListener('click', function() {
            if (window.innerWidth <= 768) {
                sidebar.classList.add('collapsed');
                sidebar.classList.remove('show');
                document.body.classList.remove('sidebar-open');
            }
        });
    }
    
    // Check screen width and adjust sidebar
    const checkWidth = () => {
        if (window.innerWidth <= 768) {
            // Mobile: começar sempre colapsado
            if (!sidebar.classList.contains('collapsed')) {
                sidebar.classList.add('collapsed');
                document.body.classList.remove('sidebar-open');
            }
            sidebar.classList.remove('show');
        } else {
            // Desktop: remover classes mobile
            sidebar.classList.remove('show');
            document.body.classList.remove('sidebar-open');
            
            // Ajustar margem do conteúdo
            if (sidebar.classList.contains('collapsed')) {
                content.style.marginLeft = '80px';
            } else {
                content.style.marginLeft = '280px';
            }
        }
    };
    
    // Add click event to menu links for mobile - fechar sidebar ao clicar
    const menuLinks = document.querySelectorAll('.nav-link');
    menuLinks.forEach(link => {
        link.addEventListener('click', function() {
            if (window.innerWidth <= 768 && !sidebar.classList.contains('collapsed')) {
                setTimeout(() => {
                    sidebar.classList.add('collapsed');
                    sidebar.classList.remove('show');
                    document.body.classList.remove('sidebar-open');
                }, 100);
            }
        });
    });
    
    // Initial check and on window resize
    checkWidth();
    window.addEventListener('resize', checkWidth);
});
</script>
